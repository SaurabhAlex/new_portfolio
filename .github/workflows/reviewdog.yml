name: React Reviewdog

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  reviewdog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify ESLint
        run: |
          npx eslint --version

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1

      - name: Run ESLint
        run: |
          npm run lint -f json -o eslint-report.json || true

      - name: Display ESLint report
        run: cat eslint-report.json

      - name: Run Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=eslint \
            -name="ESLint" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-on-error=true < eslint-report.json

      - name: Fail if ESLint errors exist
        run: npm run lint
