name: React Reviewdog

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  reviewdog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Reviewdog
        uses: reviewdog/action-setup@v1

      - name: Verify ESLint
        run: |
          npx eslint --version

      - name: Run ESLint
        id: eslint
        run: |
          set -o pipefail
          npx eslint . --format json > eslint-report.json

      - name: Show ESLint Report
        if: always()
        run: cat eslint-report.json

      - name: Reviewdog
        if: always()
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=eslint \
            -name="ESLint" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-on-error=true < eslint-report.json
